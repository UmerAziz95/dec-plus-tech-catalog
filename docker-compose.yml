services:
  db:
    image: postgres:16-alpine
    container_name: carparts_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-first_django_db}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-root123}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${DB_PORT_EXPOSE:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-first_django_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build: .
    container_name: carparts_web
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      - DJANGO_SETTINGS_MODULE=core.settings
      - SECRET_KEY=${SECRET_KEY:-django-insecure-j^5^-e107h8tk6b1g990t84)3^7v5z#ul#&h^bbir%d)-82noq}
      - DEBUG=${DEBUG:-0}
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:-localhost,127.0.0.1}
      - DB_NAME=${DB_NAME:-first_django_db}
      - DB_USER=${DB_USER:-postgres}
      - DB_PASSWORD=${DB_PASSWORD:-root123}
      - DB_HOST=db
      - DB_PORT=5432
    volumes:
      - static_files:/app/staticfiles
      - media_files:/app/media
    ports:
      - "${WEB_PORT:-8000}:8000"

volumes:
  postgres_data:
  static_files:
  media_files:
